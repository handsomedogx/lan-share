#
# LAN Share · nginx 反向代理配置
#
# 安装位置建议：
#   /etc/nginx/conf.d/lan-share.conf
# 或并入 Kwrt 的 uhttpd/nginx 站点配置。
#
# 作用（对应开发文档第 13 / 22 节）：
#   机房电脑 → 10.0.0.1:80 → nginx → 127.0.0.1:18080 → LAN Share
#
# 这样 Go 服务只监听回环地址，校园网接口无法直连 18080 端口。

upstream lan_share_backend {
    # 只连本机，Go 服务本身也只监听 127.0.0.1。
    server 127.0.0.1:18080;
    keepalive 8;
}

server {
    listen 80;
    server_name share.lan 10.0.0.1 _;

    # 大文件上传：放宽请求体上限。若程序侧设了 LANSHARE_MAX_UPLOAD_MB，
    # 这里的 client_max_body_size 必须不小于它，建议留一点余量。
    client_max_body_size 0;
    client_body_timeout 600s;

    # 关掉请求体缓冲，避免大文件上传时先落满 nginx 的临时目录（路由器空间宝贵）。
    proxy_request_buffering off;
    proxy_buffering off;

    access_log off;   # 路由器上不记每个请求，日志量必须克制
    error_log /var/log/nginx/lan-share-error.log warn;

    # ---------------------------------------------------------- WebSocket
    # 必须单独匹配，且带上 Upgrade/Connection 头，否则握手会失败。
    location /ws/ {
        proxy_pass http://lan_share_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 实时区靠 ping/pong 保活，超时给足；不能沿用默认 60s。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------------------------------------------------------- API
    location /api/ {
        proxy_pass http://lan_share_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 下载大文件需要长时间保持连接，超时要放宽。
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ---------------------------------------------------------- 静态页面
    location / {
        proxy_pass http://lan_share_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
